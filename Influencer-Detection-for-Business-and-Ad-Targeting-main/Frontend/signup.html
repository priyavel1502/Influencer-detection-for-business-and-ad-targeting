<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - InfluencerIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <h2 class="text-center">Join InfluencerIQ 🎯</h2>
            <p class="text-center text-muted mb-2">Discover top influencers and maximize your ROI.</p>
            <form id="signup-form">
                <input type="text" id="signup-name" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email Address" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="button" class="btn-primary" onclick="signup()">Sign Up</button>
            </form>
            <p class="switch-auth">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
