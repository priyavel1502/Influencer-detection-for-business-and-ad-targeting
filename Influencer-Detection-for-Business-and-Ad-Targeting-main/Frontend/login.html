<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InfluencerIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <h2 class="text-center">Welcome Back 🎯</h2>
            <p class="text-center text-muted mb-2">Login to your InfluencerIQ account.</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="button" class="btn-primary" onclick="login()">Login</button>
            </form>
            <p class="switch-auth">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
